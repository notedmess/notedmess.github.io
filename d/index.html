<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Noted Mess - duel challenge</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 48px auto; padding: 0 20px; line-height: 1.6; color: #2b2b2b; background: #faf6ec; text-align: center; }
  h1 { font-size: 30px; margin-bottom: 4px; }
  a.btn { display: block; margin: 14px 0; padding: 14px 24px; background: #2b2b2b; color: #faf6ec; border-radius: 10px; text-decoration: none; font-size: 18px; }
  a.alt { background: transparent; color: #2b2b2b; border: 2px solid #2b2b2b; }
  .small { font-size: 14px; opacity: .75; }
</style>
</head>
<body>
<h1>Noted Mess</h1>
<p id="msg">A friend challenged you to a duel!<br>Install the game to accept the challenge.</p>
<a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.notedmess.game">Get it on Google Play</a>
<a class="btn alt" id="open" href="#">I already have the game: open it</a>
<p class="small">Дружній виклик на дуель! Встанови гру, щоб прийняти його. Якщо гра вже встановлена, натисни «open it».</p>
<script>
(function () {
  var m = location.search.match(/[?&]c=([A-Za-z0-9]{10,40})/);
  var id = m ? m[1] : '';
  var store = 'https://play.google.com/store/apps/details?id=com.notedmess.game';
  if (id) store += '&referrer=' + encodeURIComponent('duel=' + id);
  document.getElementById('play').href = store;
  // Якщо гра встановлена і App Links підтверджені, система відкриває гру ще до цієї сторінки; це запасний шлях
  document.getElementById('open').href = id
    ? 'intent://notedmess.github.io/d/?c=' + id + '#Intent;scheme=https;package=com.notedmess.game;end'
    : store;
})();
</script>
</body>
</html>
